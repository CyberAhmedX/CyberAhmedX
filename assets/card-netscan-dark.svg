<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="t d"><title id="t">Network Security Scanner - real firewall enforcement and SIEM alerts</title><desc id="d">Flask and Nmap. Firewall rules run real iptables or netsh commands, and new open ports become SIEM events, with Wazuh rules tested on Wazuh 4.14.9 in CI.</desc><style>@font-face{font-family:I;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:I;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:M;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}[font-family=I]{font-family:I,Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}[font-family=M]{font-family:M,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0}.nm{transform-origin:28px 104px}@media (max-width:380px){.sub,.kick,.tags,.go{display:none}.nm{transform:translateY(-34px) scale(1.5)}}</style><defs><linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171717"/><stop offset=".45" stop-color="#111111"/></linearGradient><linearGradient id="hair" x1="0" x2="1"><stop offset="0" stop-color="#333333" stop-opacity="0"/><stop offset=".5" stop-color="#737373"/><stop offset="1" stop-color="#333333" stop-opacity="0"/></linearGradient></defs><rect x=".75" y=".75" width="638.5" height="378.5" rx="14" fill="url(#sheen)" stroke="#262626" stroke-width="1.5"/><rect x="120" y=".75" width="400" height="1" fill="url(#hair)" opacity=".7"/><text x="28.00" y="48.00" font-family="M" font-weight="500" font-size="11.5" fill="#737373" letter-spacing="1.4" class="kick">SECURITY TOOL · PYTHON</text><g class="go"><circle cx="596" cy="44" r="16" fill="#111111" stroke="#333333"/><path d="M591.5 48.5L600.0 40.0M594.0 40.0H600.0V42.5" fill="none" stroke="#a1a1a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="27.00" y="104.00" font-family="I" font-weight="600" font-size="30" fill="#ededed" letter-spacing="-0.9" class="nm">Network Security Scanner</text><g class="sub"><text x="28.00" y="134.00" font-family="I" font-weight="400" font-size="15.5" fill="#a1a1a1">Flask and Nmap. Rules run real iptables or netsh commands, and new open</text><text x="28.00" y="157.00" font-family="I" font-weight="400" font-size="15.5" fill="#a1a1a1">ports become SIEM alerts in Wazuh.</text></g><rect x="28" y="186" width="584" height="118" rx="10" fill="#171717" stroke="#262626"/><g class="tags"><rect x="28.0" y="324" width="59.4" height="26" rx="6" fill="#111111" stroke="#262626"/><text x="37.00" y="341.00" font-family="M" font-weight="500" font-size="11.5" fill="#a1a1a1">Python</text><rect x="95.4" y="324" width="45.6" height="26" rx="6" fill="#111111" stroke="#262626"/><text x="104.40" y="341.00" font-family="M" font-weight="500" font-size="11.5" fill="#a1a1a1">Nmap</text><rect x="149.0" y="324" width="73.2" height="26" rx="6" fill="#111111" stroke="#262626"/><text x="158.00" y="341.00" font-family="M" font-weight="500" font-size="11.5" fill="#a1a1a1">iptables</text><rect x="230.2" y="324" width="52.5" height="26" rx="6" fill="#111111" stroke="#262626"/><text x="239.20" y="341.00" font-family="M" font-weight="500" font-size="11.5" fill="#a1a1a1">netsh</text><rect x="290.7" y="324" width="52.5" height="26" rx="6" fill="#111111" stroke="#262626"/><text x="299.70" y="341.00" font-family="M" font-weight="500" font-size="11.5" fill="#a1a1a1">Wazuh</text></g><text x="44.00" y="214.00" font-family="M" font-weight="500" font-size="12" fill="#a1a1a1">$ scan 127.0.0.1 -sS</text><text x="44.00" y="236.00" font-family="M" font-weight="500" font-size="12" fill="#ededed">8081/tcp</text><text x="130.00" y="236.00" font-family="M" font-weight="500" font-size="12" fill="#a1a1a1">filtered</text><text x="222.00" y="236.00" font-family="M" font-weight="500" font-size="12" fill="#737373">blocked by iptables DROP</text><text x="44.00" y="258.00" font-family="M" font-weight="500" font-size="12" fill="#ededed">4444/tcp</text><text x="130.00" y="258.00" font-family="M" font-weight="500" font-size="12" fill="#34d399">open</text><text x="222.00" y="258.00" font-family="M" font-weight="500" font-size="12" fill="#737373">new since the last scan</text><line x1="44" y1="278.5" x2="596" y2="278.5" stroke="#262626"/><text x="44.00" y="295.00" font-family="M" font-weight="500" font-size="11.5" xml:space="preserve"><tspan fill="#ededed" font-weight="500">wazuh</tspan><tspan fill="#a1a1a1" font-weight="500">  rule 100503 · level 10 · new open port</tspan></text><path d="M516.9 291l2.7 2.7 5.4-6.0" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="596.00" y="295.00" font-family="M" font-weight="500" font-size="11.5" fill="#34d399" text-anchor="end">CI tested</text></svg>